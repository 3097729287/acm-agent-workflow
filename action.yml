name: '题解格式闸'
description: '对题解 Markdown 跑 18 项格式自检（LaTeX $ 配对与完整度、节白名单、目录四列、小节顺序、代码块、KaTeX 渲染…）。挂到任意仓库的 CI 上，不合格就变红。'
author: '3097729287'

branding:
  icon: 'check-square'
  color: 'green'

inputs:
  path:
    description: '要检查的题解 md：文件 / 目录 / glob，空格分隔可给多个（目录会递归收 *.md）。例：`题解/**/*.md`。必填——不给默认值，免得误扫到 README。'
    required: true
  extra-args:
    description: '原样转给 check_solution.py 的额外参数，如 `--no-compile`（跳过编译检查，快）、`--no-record`（跳过实测记录项）、`--quiet`（只打印有问题的项）。'
    required: false
    default: ''
  python-version:
    description: '跑闸用的 Python 版本。18 项里需要编译的那几项另外要 g++，没有会如实记「未验证」而不是报错。'
    required: false
    default: '3.13'

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: 跑 18 项格式闸
      shell: bash
      env:
        GATE_ROOT: ${{ github.action_path }}
        GATE_PATHS: ${{ inputs.path }}
        GATE_ARGS: ${{ inputs.extra-args }}
      run: python "$GATE_ROOT/skills/check-solution/action_run.py"
